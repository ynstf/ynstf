name: Generate profile metrics

on:
  schedule:
    # Runs once a day at 03:00 UTC. Change the cron expression if you want a different frequency.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]    # also regenerate whenever you push to main

permissions:
  contents: write         # needed so the action can commit the generated SVG back to this repo

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # built-in token, auto-provided by GitHub Actions — no setup needed
          filename: assets/metrics.svg
          committer_message: "chore: update profile metrics [skip ci]"

          # --- theme, matched to your matrix/terminal README ---
          config_display: large
          config_timezone: Africa/Casablanca
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_streak: yes

          base: header, activity, community, repositories, metadata